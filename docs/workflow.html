<title>三 AI 协作流程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: same board as trunk DesignMockups/协作流程 — four role lanes, numbered nodes, shared layer at the bottom */
  :root {
    --primary: #36B6A9;
    --primary-strong: #168f85;
    --primary-soft: #e8f8f5;
    --code: #587ee8;
    --code-soft: #edf2ff;
    --warn: #d65f55;
    --warn-soft: #fff0ed;
    --ink: #162b2a;
    --muted: #607573;
    --surface: #ffffff;
    --surface-2: #f5f8f7;
    --lane: #fbfcfc;
    --line: #cfddda;
    --shadow: 0 18px 48px rgba(18, 57, 53, .10);
    --grid: rgba(54, 182, 169, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #4bcabd; --primary-strong: #75ded4; --primary-soft: #123c38;
      --code: #88a7ff; --code-soft: #1c294d; --warn: #ff8f84; --warn-soft: #452522;
      --ink: #edf7f5; --muted: #a8bfbb; --surface: #101918; --surface-2: #162321;
      --lane: #121e1d; --line: #2d4441; --shadow: 0 18px 48px rgba(0, 0, 0, .32);
      --grid: rgba(75, 202, 189, .055); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --primary: #4bcabd; --primary-strong: #75ded4; --primary-soft: #123c38;
    --code: #88a7ff; --code-soft: #1c294d; --warn: #ff8f84; --warn-soft: #452522;
    --ink: #edf7f5; --muted: #a8bfbb; --surface: #101918; --surface-2: #162321;
    --lane: #121e1d; --line: #2d4441; --shadow: 0 18px 48px rgba(0, 0, 0, .32);
    --grid: rgba(75, 202, 189, .055); color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    overflow-x: hidden;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px),
      var(--surface-2);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }
  header {
    max-width: 1540px;
    margin: 0 auto;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    padding-block: 40px 24px;
  }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  h1 { margin: 0; font-size: clamp(28px, 4vw, 48px); line-height: 1.12; letter-spacing: -.035em; text-wrap: balance; }
  .lede { display: flex; align-items: center; gap: 10px; margin: 13px 0 0; color: var(--muted); font-size: 14px; }
  .lede::before { width: 30px; height: 3px; border-radius: 99px; background: var(--primary); content: ""; flex: none; }
  .tool-toggle {
    display: inline-flex; flex: 0 0 auto; align-items: center; gap: 9px;
    border: 1px solid var(--primary); border-radius: 999px; padding: 8px 12px;
    background: var(--primary-soft); color: var(--primary-strong);
    font: 700 12px/1 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; cursor: pointer;
  }
  .tool-toggle:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .toggle-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
  .tool-toggle[aria-pressed="false"] { opacity: .68; }
  .tool-toggle[aria-pressed="false"] .toggle-dot { background: var(--muted); box-shadow: none; }

  .scroll-shell {
    overflow-x: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 42px;
  }
  .board { display: block; width: min(1500px, 100%); min-width: 960px; height: auto; margin: 0 auto; filter: drop-shadow(var(--shadow)); }

  .board .board-bg { fill: var(--surface); stroke: var(--line); }
  .board .lane { fill: var(--lane); stroke: var(--line); }
  .board .lane-head { fill: var(--surface-2); }
  .board .lane-accent { fill: var(--primary); }
  .board .role-title { fill: var(--ink); font-size: 20px; font-weight: 750; }
  .board .role-sub { fill: var(--muted); font-size: 12.5px; }
  .board .section-label { fill: var(--muted); font-size: 12px; font-weight: 750; letter-spacing: .14em; }
  .board .divider { stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 7; }
  .board .flow { fill: none; stroke: var(--primary-strong); stroke-width: 2.5; marker-end: url(#arrow); }
  .board .flow-code { fill: none; stroke: var(--code); stroke-width: 2.5; marker-end: url(#arrow-code); }
  .board .flow-return { fill: none; stroke: var(--warn); stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#arrow-return); }
  .board .flow-neutral { fill: none; stroke: var(--muted); stroke-width: 2; marker-end: url(#arrow-neutral); }
  .board .node { fill: var(--surface); stroke: var(--line); stroke-width: 1.3; }
  .board .node-design { fill: var(--primary-soft); stroke: var(--primary); stroke-width: 1.5; }
  .board .node-code { fill: var(--code-soft); stroke: var(--code); stroke-width: 1.5; }
  .board .node-title { fill: var(--ink); font-size: 14px; font-weight: 720; }
  .board .node-body { fill: var(--muted); font-size: 12px; }
  .board .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
  .board .badge { fill: var(--primary); }
  .board .badge-code { fill: var(--code); }
  .board .badge-plain { fill: var(--muted); }
  .board .badge-text { fill: #fff; font-size: 12px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
  .board .decision { fill: var(--surface); stroke: var(--primary); stroke-width: 1.6; }
  .board .decision-code { fill: var(--surface); stroke: var(--code); stroke-width: 1.6; }
  .board .decision-text { fill: var(--ink); font-size: 13px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
  .board .edge-label-bg { fill: var(--surface); stroke: var(--line); }
  .board .edge-label { fill: var(--muted); font-size: 11px; font-weight: 700; }
  .board .edge-label-warn { fill: var(--warn); font-size: 11px; font-weight: 750; }
  .board .lane-note { fill: var(--muted); font-size: 12px; opacity: .7; }
  .board .shared { fill: var(--primary-soft); stroke: var(--primary); stroke-width: 1.5; }
  .board .shared-title { fill: var(--primary-strong); font-size: 18px; font-weight: 800; }
  .board .shared-label { fill: var(--ink); font-size: 12.5px; font-weight: 700; }
  .board .shared-copy { fill: var(--muted); font-size: 11.5px; }
  .board .tool-chip { fill: var(--primary-soft); stroke: var(--primary); stroke-width: 1; }
  .board .tool-chip-text { fill: var(--primary-strong); font-size: 9.5px; font-weight: 700; }
  .board .tool-chip-note { fill: var(--muted); font-size: 8.5px; }
  .board .mini-tool-chip { fill: var(--surface); stroke: var(--line); stroke-width: .9; }
  .board .mini-tool-text { fill: var(--ink); font-size: 8.5px; font-weight: 700; }
  .board .owner-dot-claude { fill: var(--primary); }
  .board .owner-dot-cursor { fill: var(--code); }
  .board .support-card { fill: var(--surface); stroke: var(--primary); stroke-width: 1.2; }
  .board .support-title { fill: var(--primary-strong); font-size: 15px; font-weight: 800; }
  .board .support-copy { fill: var(--muted); font-size: 11px; }
  .board .skill-line-name { fill: var(--primary-strong); font-size: 10px; font-weight: 800; }
  .board .skill-line { fill: var(--muted); font-size: 10px; }
  .board .rule-group { fill: var(--primary-strong); font-size: 11px; font-weight: 800; }
  .board .rule-list { fill: var(--muted); font-size: 9.5px; }
  .board .audit-badge { fill: var(--primary-soft); stroke: var(--primary); stroke-width: 1; }
  .board .audit-badge-text { fill: var(--primary-strong); font-size: 10px; font-weight: 800; }
  .tools-hidden .tool-annotation { display: none; }

  @media (max-width: 700px) {
    header { padding-top: 28px; }
    .header-row { align-items: stretch; flex-direction: column; gap: 16px; }
    .tool-toggle { align-self: flex-start; }
  }
</style>

<header>
  <div class="header-row">

      <span class="toggle-dot" aria-hidden="true"></span>
      <span>隐藏工具标注</span>

  </div>
  <p class="lede">一个需求，从拿到草稿图到设计、开发、验收、提交</p>
</header>

<main class="scroll-shell" aria-label="可横向滚动的协作流程图">
